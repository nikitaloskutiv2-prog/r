<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/register.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>Register - Timess</title>
</head>
<body>

<button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo">💬</div>
        <div class="auth-title">Timess</div>
        <div class="auth-subtitle">Создай новый аккаунт</div>
    </div>
    
    <div class="error-message" id="error"></div>
    <div class="success-message" id="success"></div>
    
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Логин</label>
            <input
                id="login"
                type="text"
                placeholder="Введите логин"
                required
                minlength="3"
                maxlength="100"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>Имя пользователя</label>
            <input
                id="username"
                type="text"
                placeholder="Введите имя пользователя"
                required
                maxlength="30"
                autocomplete="name"
            >
        </div>

        <div class="form-group">
            <label>Пароль</label>
            <input
                id="password"
                type="password"
                placeholder="Придумай пароль"
                required
                minlength="4"
                maxlength="128"
                autocomplete="new-password"
            >
        </div>

        <div class="form-group">
            <label>Подтверди пароль</label>
            <input
                id="passwordConfirm"
                type="password"
                placeholder="Повтори пароль"
                required
                minlength="4"
                maxlength="128"
                autocomplete="new-password"
            >
        </div>
        
        <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>
    
    <div class="auth-link">
        Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
</div>
<script src="js/logger.js"></script>
<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
