<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>Login - Timess</title>
</head>
<body>

<button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo">💬</div>
        <div class="auth-title">Timess</div>
        <div class="auth-subtitle">Войди в свой аккаунт</div>
    </div>
    
    <div class="error-message" id="error"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Логин</label>

            <input
                id="login"
                type="text"
                placeholder="Введите логин"
                required
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>Пароль</label>

            <input
                id="password"
                type="password"
                placeholder="Введите пароль"
                required
                autocomplete="current-password"
            >
        </div>
        
        <button type="submit" class="submit-btn">Войти</button>
    </form>
    
    <div class="auth-link">
        Нет аккаунта? <a href="register.html">Зарегистрируйся</a>
    </div>
</div>
<script src="js/logger.js"></script>
<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>
</html>
